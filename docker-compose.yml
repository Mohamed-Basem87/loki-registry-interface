services:
  registry-interface:
    image: mohamedbasem2/loki-registry-interface:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8080"
      ADMIN_PASSWORD_FILE: /run/secrets/registry_admin_password
      SESSION_SECRET_FILE: /run/secrets/registry_session_secret
      GITHUB_APP_PRIVATE_KEY_FILE: /run/secrets/github_app_private_key
    ports:
      - "${PORT:-8080}:8080"
    secrets:
      - registry_admin_password
      - registry_session_secret
      - github_app_private_key
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

secrets:
  registry_admin_password:
    file: ./secrets/registry_admin_password
  registry_session_secret:
    file: ./secrets/registry_session_secret
  github_app_private_key:
    file: ./secrets/github_app_private_key.pem
